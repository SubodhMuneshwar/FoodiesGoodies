<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Recipe Studio - Foodies Goodies</title>
    <meta name="description" content="Share your culinary masterpiece with the Foodies Goodies community. Publish steps, ingredients, and photos.">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/recipe.css">
    <link rel="icon" type="image/png" href="../assets/images/fav.png">
    <style>
        .studio-container {
            max-width: 900px;
            width: 92%;
            margin: calc(var(--header-height) + 24px) auto 60px;
            background: rgba(18, 18, 24, 0.92);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 36px;
            backdrop-filter: blur(20px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.5s ease-in-out;
        }
        .studio-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }
        .studio-header ion-icon {
            font-size: 2.4rem;
            color: var(--primary-gold);
        }
        .studio-header h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 4px;
        }
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .form-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.09);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }
        .dynamic-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .dynamic-row input {
            flex: 1;
        }
        .btn-remove-row {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-remove-row:hover {
            background: #ef4444;
            color: #fff;
        }
        .btn-add-row {
            background: rgba(210, 168, 28, 0.12);
            border: 1px dashed var(--primary-gold);
            color: var(--primary-gold);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            margin-top: 6px;
        }
        .btn-add-row:hover {
            background: var(--primary-gold);
            color: #000;
        }
        .btn-publish-submit {
            background: linear-gradient(135deg, var(--primary-gold) 0%, #b8860b 100%);
            color: #0d0d12;
            font-weight: 800;
            font-size: 1.05rem;
            border: none;
            padding: 14px 28px;
            border-radius: var(--radius-full);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 6px 20px rgba(210, 168, 28, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-publish-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(210, 168, 28, 0.5);
        }
        @media (max-width: 768px) {
            .form-grid-2, .form-grid-4 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="#studio-main" class="skip-link">Skip to recipe form</a>

    <!-- HEADER NAVBAR -->
    <header class="header">
        <a href="../index.html" class="logo">Foodies Goodies</a>
        <nav class="navbar" aria-label="Main Navigation">
            <a class="nav-link" href="../index.html">Home</a>
            <a class="nav-link" href="explore.html">Explore</a>
            <a class="nav-link" href="ai.html">AI Dietician</a>
            <a class="nav-link" href="contact.html">Contact us</a>
            <a class="nav-login-btn" href="dashboard.html">
                <ion-icon name="grid-outline"></ion-icon>
                <span>Dashboard</span>
            </a>
        </nav>
    </header>

    <main class="studio-container" id="studio-main">
        <div class="studio-header">
            <ion-icon name="restaurant-outline"></ion-icon>
            <div>
                <h1>Chef's Recipe Studio</h1>
                <p style="color:#94a3b8;">Craft and share your signature dishes with the worldwide kitchen crew.</p>
            </div>
        </div>

        <form id="recipe-studio-form">
            <!-- Title -->
            <div class="form-group">
                <label for="recipe-title">Recipe Title *</label>
                <input type="text" id="recipe-title" name="title" class="form-control" placeholder="e.g. Saffron Infused Seafood Paella" required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="recipe-desc">Culinary Story / Description</label>
                <textarea id="recipe-desc" name="description" class="form-control" placeholder="Share the personal history, flavor profile, or cooking inspiration behind this dish..."></textarea>
            </div>

            <!-- Media Upload & Preset -->
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="recipe-image-input">Dish Photograph</label>
                    <input type="file" id="recipe-image-input" class="form-control" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="preset-image">Or Image URL / Preset</label>
                    <input type="url" id="preset-image" class="form-control" placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80">
                </div>
            </div>

            <!-- Attributes Grid -->
            <div class="form-grid-4">
                <div class="form-group">
                    <label for="cuisine-type">Cuisine</label>
                    <select id="cuisine-type" class="form-control">
                        <option value="Italian">Italian</option>
                        <option value="French">French</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Mexican">Mexican</option>
                        <option value="Indian">Indian</option>
                        <option value="Mediterranean">Mediterranean</option>
                        <option value="American">American</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Healthy">Healthy & Fit</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="meal-type">Meal Type</label>
                    <select id="meal-type" class="form-control">
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner" selected>Dinner</option>
                        <option value="snack">Snack</option>
                        <option value="dessert">Dessert</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty" class="form-control">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Master Chef (Hard)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="visibility">Visibility</label>
                    <select id="visibility" class="form-control">
                        <option value="public" selected>Public (Everyone)</option>
                        <option value="followers">Sous Chefs Only</option>
                        <option value="private">Private (Only Me)</option>
                    </select>
                </div>
            </div>

            <!-- Times & Servings -->
            <div class="form-grid-3" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;">
                <div class="form-group">
                    <label for="prep-time">Prep Time (Mins)</label>
                    <input type="number" id="prep-time" class="form-control" value="15" min="1">
                </div>
                <div class="form-group">
                    <label for="cook-time">Cook Time (Mins)</label>
                    <input type="number" id="cook-time" class="form-control" value="25" min="1">
                </div>
                <div class="form-group">
                    <label for="servings">Servings</label>
                    <input type="number" id="servings" class="form-control" value="4" min="1">
                </div>
            </div>

            <!-- Dynamic Ingredients -->
            <div class="form-group">
                <label>Ingredients List</label>
                <div id="ingredients-rows-container">
                    <div class="dynamic-row">
                        <input type="text" class="form-control ing-name" placeholder="Ingredient (e.g. Buffalo Mozzarella)" value="Fresh Buffalo Mozzarella" required>
                        <input type="text" class="form-control ing-qty" placeholder="Quantity (e.g. 200)" value="200" style="max-width:130px;">
                        <input type="text" class="form-control ing-unit" placeholder="Unit (e.g. grams)" value="grams" style="max-width:110px;">
                        <button type="button" class="btn-remove-row" onclick="removeRow(this)" aria-label="Remove ingredient">
                            <ion-icon name="trash-outline"></ion-icon>
                        </button>
                    </div>
                </div>
                <button type="button" class="btn-add-row" id="btn-add-ingredient">
                    <ion-icon name="add-circle-outline"></ion-icon>
                    <span>Add Ingredient</span>
                </button>
            </div>

            <!-- Dynamic Steps -->
            <div class="form-group">
                <label>Step-by-Step Instructions</label>
                <div id="steps-rows-container">
                    <div class="dynamic-row">
                        <input type="text" class="form-control step-text" placeholder="Step 1: Prep and prepare cooking surface..." value="Whisk ingredients and preheat cooking surface to optimal temperature." required>
                        <button type="button" class="btn-remove-row" onclick="removeRow(this)" aria-label="Remove step">
                            <ion-icon name="trash-outline"></ion-icon>
                        </button>
                    </div>
                </div>
                <button type="button" class="btn-add-row" id="btn-add-step">
                    <ion-icon name="add-circle-outline"></ion-icon>
                    <span>Add Cooking Step</span>
                </button>
            </div>

            <!-- Tags -->
            <div class="form-group">
                <label for="tags">Tags (Comma-Separated)</label>
                <input type="text" id="tags" class="form-control" placeholder="e.g. artisanal, woodfired, italian, quick-dinner" value="fresh, gourmet, chef-special">
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-publish-submit">
                <ion-icon name="cloud-upload-outline"></ion-icon>
                <span>Publish Recipe to Community</span>
            </button>
        </form>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer_text">
            <p>&copy; 2024 Foodies Goodies. All rights reserved.</p>
            <p class="footer-tagline">Connecting passion and flavor worldwide.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        let ingIndex = 1;
        let stepIndex = 1;

        document.getElementById('btn-add-ingredient').addEventListener('click', () => {
            const container = document.getElementById('ingredients-rows-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row';
            row.innerHTML = `
                <input type="text" class="form-control ing-name" placeholder="Ingredient name..." required>
                <input type="text" class="form-control ing-qty" placeholder="Qty" style="max-width:130px;">
                <input type="text" class="form-control ing-unit" placeholder="Unit" style="max-width:110px;">
                <button type="button" class="btn-remove-row" onclick="removeRow(this)" aria-label="Remove ingredient">
                    <ion-icon name="trash-outline"></ion-icon>
                </button>
            `;
            container.appendChild(row);
            ingIndex++;
        });

        document.getElementById('btn-add-step').addEventListener('click', () => {
            const container = document.getElementById('steps-rows-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row';
            row.innerHTML = `
                <input type="text" class="form-control step-text" placeholder="Step ${stepIndex + 1}: Next culinary instruction..." required>
                <button type="button" class="btn-remove-row" onclick="removeRow(this)" aria-label="Remove step">
                    <ion-icon name="trash-outline"></ion-icon>
                </button>
            `;
            container.appendChild(row);
            stepIndex++;
        });

        function removeRow(btn) {
            const row = btn.closest('.dynamic-row');
            if (row && row.parentElement.children.length > 1) {
                row.remove();
            }
        }

        document.getElementById('recipe-studio-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('recipe-title').value.trim();
            const desc = document.getElementById('recipe-desc').value.trim();
            const cuisine = document.getElementById('cuisine-type').value;
            const meal = document.getElementById('meal-type').value;
            const diff = document.getElementById('difficulty').value;
            const prepTime = document.getElementById('prep-time').value;
            const cookTime = document.getElementById('cook-time').value;
            const servings = document.getElementById('servings').value;
            const image = document.getElementById('preset-image').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80';

            const ings = Array.from(document.querySelectorAll('.dynamic-row')).map(row => {
                const name = row.querySelector('.ing-name')?.value;
                const qty = row.querySelector('.ing-qty')?.value || '';
                const unit = row.querySelector('.ing-unit')?.value || '';
                return name ? `${qty} ${unit} ${name}`.trim() : null;
            }).filter(Boolean);

            const steps = Array.from(document.querySelectorAll('.step-text')).map(input => input.value.trim()).filter(Boolean);

            const newId = 'rec_' + Date.now();
            const recipeObj = {
                id: newId,
                title: title,
                description: desc,
                category: cuisine,
                cuisine_type: cuisine,
                meal_type: meal,
                difficulty: diff,
                prep_time: prepTime,
                cook_time: cookTime,
                servings: servings,
                image: image,
                image_path: image,
                likesCount: 1,
                comments_count: 0,
                authorName: 'Chef Alex Morgan',
                authorHandle: '@chef_alex',
                authorAvatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80',
                ingredients: ings,
                steps: steps
            };

            const existing = JSON.parse(localStorage.getItem('foodies_community_recipes') || '[]');
            existing.unshift(recipeObj);
            localStorage.setItem('foodies_community_recipes', JSON.stringify(existing));

            swal({
                title: 'Recipe Published to Community! 🍳',
                text: `"${title}" is now live in the community feed!`,
                icon: 'success'
            }).then(() => {
                window.location.href = `recipe.html?id=${newId}`;
            });
        });
    </script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
