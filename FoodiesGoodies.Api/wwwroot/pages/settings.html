<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Profile Settings - Foodies Goodies</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" type="image/png" href="../assets/images/fav.png">
    <style>
        .settings-container {
            max-width: 760px;
            width: 92%;
            margin: calc(var(--header-height) + 24px) auto 60px;
            background: rgba(18, 18, 24, 0.92);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 36px;
            backdrop-filter: blur(20px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.5s ease-in-out;
        }
        .settings-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }
        .settings-header ion-icon {
            font-size: 2.2rem;
            color: var(--primary-gold);
        }
        .settings-header h1 {
            font-size: 1.8rem;
            color: #fff;
        }
        .avatar-preview-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .avatar-preview-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-gold);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-gold);
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .toggle-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-gold);
            cursor: pointer;
        }
        .toggle-row label {
            cursor: pointer;
            color: #f1f5f9;
            font-size: 0.95rem;
        }
        .btn-save-settings {
            background: linear-gradient(135deg, var(--primary-gold) 0%, #b8860b 100%);
            color: #0d0d12;
            font-weight: 800;
            font-size: 1.05rem;
            border: none;
            padding: 14px 28px;
            border-radius: var(--radius-full);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(210, 168, 28, 0.35);
        }
    </style>
</head>
<body>
    <a href="#settings-main" class="skip-link">Skip to settings form</a>

    <!-- HEADER NAVBAR -->
    <header class="header">
        <a href="../index.html" class="logo">Foodies Goodies</a>
        <nav class="navbar" aria-label="Main Navigation">
            <a class="nav-link" href="../index.html">Home</a>
            <a class="nav-link" href="explore.html">Explore</a>
            <a class="nav-link" href="ai.html">AI Dietician</a>
            <a class="nav-link" href="contact.html">Contact us</a>
            <a class="nav-login-btn" href="dashboard.html">
                <ion-icon name="grid-outline"></ion-icon>
                <span>Dashboard</span>
            </a>
        </nav>
    </header>

    <main class="settings-container" id="settings-main">
        <div class="settings-header">
            <ion-icon name="settings-outline"></ion-icon>
            <div>
                <h1>Chef Profile &amp; Kitchen Settings</h1>
                <p style="color:#94a3b8;">Manage your culinary identity and privacy preferences.</p>
            </div>
        </div>

        <form id="settings-form">
            <!-- Avatar Section -->
            <div class="avatar-preview-row">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar" class="avatar-preview-img" id="avatar-preview">
                <div>
                    <label style="font-weight:700;color:#fff;display:block;margin-bottom:6px;">Chef Avatar</label>
                    <input type="file" id="avatar_file" accept="image/*" class="form-control" style="font-size:0.85rem;">
                </div>
            </div>

            <!-- Avatar URL Alternative -->
            <div class="form-group">
                <label for="profile_pic_url">Or Image URL</label>
                <input type="url" id="profile_pic_url" class="form-control" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80">
            </div>

            <!-- Username & Email (Read-Only) -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" value="chef_alex" disabled>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" value="alex@foodiesgoodies.com" disabled>
                </div>
            </div>

            <!-- Bio -->
            <div class="form-group">
                <label for="bio">Culinary Bio</label>
                <textarea id="bio" class="form-control" rows="4">Artisanal baker, sourdough obsessive &amp; Mediterranean home cook. Always chasing the perfect crust!</textarea>
            </div>

            <!-- Kitchen Privacy Mode -->
            <div class="toggle-row">
                <input type="checkbox" id="is_private">
                <label for="is_private">
                    <strong>Private Kitchen Mode (Requires Recipe Request)</strong><br>
                    <span style="color:#94a3b8;font-size:0.85rem;">When enabled, sous chefs must send a Recipe Request for approval before following your kitchen.</span>
                </label>
            </div>

            <button type="submit" class="btn-save-settings">
                <ion-icon name="save-outline"></ion-icon>
                <span>Save Profile Changes</span>
            </button>
        </form>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer_text">
            <p>&copy; 2024 Foodies Goodies. All rights reserved.</p>
            <p class="footer-tagline">Connecting passion and flavor worldwide.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        document.getElementById('settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const bio = document.getElementById('bio').value;
            const pic = document.getElementById('profile_pic_url').value;
            const isPrivate = document.getElementById('is_private').checked;

            const currentUser = JSON.parse(localStorage.getItem('foodies_user') || '{}');
            currentUser.bio = bio;
            currentUser.profile_pic = pic;
            currentUser.is_private = isPrivate;
            localStorage.setItem('foodies_user', JSON.stringify(currentUser));

            document.getElementById('avatar-preview').src = pic;

            swal({
                title: 'Profile Updated! 👨🍳',
                text: 'Your chef bio and kitchen privacy settings have been saved.',
                icon: 'success'
            });
        });
    </script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
